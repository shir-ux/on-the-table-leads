<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>On The Table - ניהול לידים</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💜</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700;800&display=swap">
<style>
/* שפת העיצוב של SDM - כהה, סגול וזהב. אותם ערכים כמו בדוחות הלקוחות החיים. */
:root{
  --bg:#170322; --paper:#250735; --paper2:#31103F; --well:#0A010F;
  --ink:#EFE3EE; --ink2:#D9C6D8; --mut:#B79CB4; --line:rgba(255,255,255,.13);
  --gold:#E8BE0E; --golds:#F0D264; --mag:#C0289B; --pink:#F3A6DD;
  --orange:#FF9A3D; --lav:#B694FF; --rasp:#C2185B; --r:18px;
  --ring:0 3px 10px rgba(0,0,0,.85) inset, 0 0 0 1px rgba(232,190,14,.22);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  background-image:radial-gradient(rgba(232,190,14,.06) 1.2px, transparent 1.5px);
  background-size:24px 24px;
  font-family:'Rubik','Segoe UI',Arial,sans-serif; font-weight:300;
  font-size:16px; line-height:1.55; min-height:100vh; -webkit-font-smoothing:antialiased;
}
button{font-family:inherit; font-size:inherit; cursor:pointer}
input,select,textarea{
  font-family:inherit; font-size:16px; color:var(--ink); color-scheme:dark;
  background:var(--well); border:1px solid var(--line); border-radius:12px;
  padding:11px 12px; width:100%;
}
input::placeholder,textarea::placeholder{color:var(--mut)}
input:focus,select:focus,textarea:focus,button:focus-visible{
  outline:2px solid var(--gold); outline-offset:1px;
}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}

/* ---------- header ---------- */
.hero{
  background:#12021B; position:relative; overflow:hidden;
  padding:26px 18px 34px; text-align:center;
  border-bottom:1px solid rgba(232,190,14,.28);
}
.hero::before{
  content:""; position:absolute; width:820px; height:820px;
  top:calc(50% - 410px); left:calc(34% - 410px);
  background:radial-gradient(closest-side, rgba(192,40,155,.42), transparent 70%);
}
.hero-in{position:relative; max-width:1012px; margin:0 auto}
.hero .logo{position:absolute; inset-inline-start:0; top:50%; transform:translateY(-50%); height:46px; width:auto}
.hero .eyebrow{color:var(--gold); font-weight:600; font-size:12.5px; letter-spacing:.34em}
.hero h1{margin:8px 0 0; font-weight:800; font-size:30px; line-height:1.1; color:#fff}

.wrap{max-width:1040px; margin:0 auto; padding:0 14px 96px}

/* ---------- segmented switch: לשוניות + בחירת סטטוס ---------- */
.tabs{
  display:grid; gap:6px; background:var(--well); border-radius:22px; padding:6px;
  box-shadow:var(--ring);
  grid-template-columns:repeat(3,minmax(0,1fr)); margin:-20px auto 16px; position:relative; max-width:612px; /* הלשוניות נשארות צרות גם במסך רחב */
}
.tab{
  border:0; background:none; border-radius:16px; height:46px; padding:0 4px;
  font-weight:500; font-size:14px; line-height:1.15; color:rgba(239,227,238,.55);
  display:flex; align-items:center; justify-content:center; gap:5px; text-align:center;
}
.tab .ico{width:18px; height:18px; flex-shrink:0}
.tab.active{
  background:var(--gold); color:var(--bg); font-weight:700;
  box-shadow:0 0 18px rgba(232,190,14,.35);
}

/* ---------- כפתורי בחירה: לכל ערך הצבע שלו (--c), זהה לתווית שעל כרטיס הליד ---------- */
.picks{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px}
.pick{
  height:54px; padding:0 8px; border-radius:14px; border:0;
  background:var(--c); color:var(--on);
  font-weight:600; font-size:15px; line-height:1.15;
  display:flex; align-items:center; justify-content:center; gap:6px; text-align:center;
}
.pick.on{font-weight:800; box-shadow:0 0 0 3px var(--paper), 0 0 0 6px var(--gold)}
.pick.on::before{content:"✓"; font-weight:800}
.picks.has-on .pick:not(.on){opacity:.4}
.tab{position:relative; white-space:nowrap}
.tab .badge{
  position:absolute; top:-5px; inset-inline-end:-2px;
  display:inline-flex; align-items:center; justify-content:center;
  min-width:18px; height:18px; border-radius:9px; padding:0 5px;
  background:var(--mag); color:#fff; font-size:11px; font-weight:800;
}

/* ---------- toolbar ---------- */
.toolbar{display:flex; gap:8px; margin-bottom:10px}
.toolbar input{flex:1; background:var(--paper)}
.btn-icon{
  width:46px; min-width:46px; height:46px; border-radius:12px; border:1px solid var(--line);
  background:var(--paper); color:var(--gold); font-size:18px;
}
.chips{display:flex; gap:6px; overflow-x:auto; padding:2px 0 12px; -webkit-overflow-scrolling:touch}
.chip{
  border:1px solid var(--line); background:var(--paper); color:var(--ink2);
  border-radius:999px; padding:6px 13px; font-size:13px; white-space:nowrap; font-weight:400;
}
.chip.active{background:var(--gold); border-color:var(--gold); color:var(--bg); font-weight:600}

/* ---------- cards ---------- */
.card{
  background:var(--paper); border:1px solid rgba(192,40,155,.35); border-radius:22px;
  padding:16px; margin-bottom:12px;
}
.ico{width:18px; height:18px; flex-shrink:0}
bdi{unicode-bidi:isolate}

/* כרטיס ליד: זהות | טופס מהיר | פעולות. בנייד נערם לשתי שורות. */
.lead{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:14px 12px; align-items:start}
.lead-id{min-width:0}
.lead-date{display:flex; align-items:center; gap:7px; color:var(--ink2); font-size:13.5px}
.lead-name{font-weight:800; font-size:21px; line-height:1.2; color:#fff; margin:6px 0 4px; overflow-wrap:anywhere}
.lead-phone{display:flex; align-items:center; gap:7px; color:var(--ink); font-size:16px}
.lead-extra{color:var(--mut); font-size:12.5px; margin-top:6px}
.lead-extra span{white-space:nowrap}
.lead-extra .overdue{color:var(--orange); font-weight:500}

/* תווית סטטוס - ניאון: מילוי בצבע הסטטוס + הילה באותו צבע */
.pill{
  display:inline-block; border-radius:99px; padding:6px 16px; margin-top:10px;
  font-size:13.5px; font-weight:800; white-space:nowrap;
  background:var(--c); color:var(--on);
  box-shadow:0 0 6px var(--c), 0 0 18px color-mix(in srgb, var(--c) 65%, transparent);
}

.lead-side{display:flex; flex-direction:column; gap:10px}
.round{
  width:46px; height:46px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  background:var(--paper2); border:1px solid var(--line); color:#fff; text-decoration:none;
}
.round .ico{width:22px; height:22px}
.round.wa{color:#3DDC6A}

.lead-form{
  grid-column:1 / -1; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px 10px;
  border-top:1px solid var(--line); padding-top:14px;
}
.lf{min-width:0}
.lf.wide{grid-column:1 / -1}
.lf-label{display:flex; align-items:center; gap:7px; color:var(--ink2); font-size:13.5px; margin-bottom:7px}
.lf input{height:48px; border-radius:14px; background:var(--paper2)}
.dt{display:grid; grid-template-columns:minmax(0,1.5fr) minmax(0,1fr); gap:8px}
.dt input{padding-inline:10px}
.lf input.due{border-color:var(--orange)}
.doc-btn{
  width:100%; height:48px; border:0; border-radius:14px; padding:0 16px;
  background:var(--gold); color:var(--bg); font-weight:800; font-size:16px;
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  box-shadow:0 0 18px rgba(232,190,14,.3);
}
.lf-save{
  grid-column:1 / -1; justify-self:start; border:0; background:none; padding:2px 0;
  color:var(--ink2); font-size:15px; font-weight:500; display:flex; align-items:center; gap:7px;
}
.lf-save:disabled{opacity:.5}

@media (min-width:900px){
  .lead{grid-template-columns:minmax(220px,1fr) minmax(0,2.4fr) auto; gap:0 22px; align-items:center; padding:22px 24px}
  .lead-id{text-align:center}
  .lead-date,.lead-phone{justify-content:center}
  .lead-name{font-size:24px}
  .lead-form{
    grid-column:auto; grid-template-columns:minmax(0,1fr) minmax(0,1.7fr) minmax(0,1.2fr); gap:10px 16px;
    border-top:0; padding-top:0; border-inline:1px solid var(--line); padding-inline:22px;
  }
  .lf.wide{grid-column:auto}
  .lead-side{order:3}
}

.section-title{
  display:flex; align-items:center; gap:8px; margin:18px 2px 8px;
  color:#fff; font-weight:700; font-size:15px;
}
.section-title .count{
  background:rgba(232,190,14,.14); color:var(--golds); border-radius:999px;
  font-size:12px; font-weight:700; padding:1px 9px;
}
.empty{
  text-align:center; color:var(--mut); padding:36px 10px; font-size:14.5px;
  background:var(--paper); border:1px solid var(--line); border-radius:var(--r);
}

/* ---------- summary ---------- */
.tiles{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px}
.tile{
  background:var(--paper); border:1px solid var(--line); border-radius:var(--r);
  padding:16px 12px 14px; text-align:center; height:104px;
  display:flex; flex-direction:column; justify-content:flex-start; gap:4px;
}
.tile .big{font-weight:800; font-size:30px; color:#fff; line-height:1.1}
.tile.gold .big{color:var(--gold)}
.tile .cap{color:var(--mut); font-size:12.5px; font-weight:400}
.bar-row{display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--line)}
.bar-row:last-child{border-bottom:0}
.bar-label{width:150px; min-width:150px; font-size:13.5px; color:var(--ink2)}
.bar-track{flex:1; height:10px; background:var(--well); border-radius:5px; overflow:hidden}
.bar-fill{height:100%; border-radius:5px; background:var(--gold)}
.bar-num{width:30px; min-width:30px; text-align:left; font-size:13px; font-weight:700; color:#fff}

/* ---------- modal (bottom sheet) ---------- */
.overlay{
  position:fixed; inset:0; background:rgba(5,0,8,.72); z-index:40;
  display:flex; align-items:flex-end; justify-content:center;
}
.sheet{
  background:var(--paper); width:100%; max-width:640px; max-height:92vh; overflow-y:auto;
  border-radius:24px 24px 0 0; padding:20px 18px 26px;
  border-top:1px solid rgba(232,190,14,.28);
}
.overlay.pop{z-index:50; align-items:center; padding:16px}
.popbox{
  background:var(--paper); width:100%; max-width:440px; max-height:92vh; overflow-y:auto;
  border:1px solid rgba(232,190,14,.28); border-radius:22px; padding:20px 18px;
}
.sheet h2,.popbox h2{margin:0 0 2px; font-size:21px; font-weight:800; color:#fff}
.sheet .sub,.popbox .sub{color:var(--mut); font-size:13px; margin-bottom:16px}
.field{margin-bottom:14px}
.field label,.field .label{
  display:block; font-size:12.5px; font-weight:600; color:var(--gold);
  letter-spacing:.06em; margin-bottom:6px;
}
.field-row{display:flex; gap:10px}
.field-row .field{flex:1}
.check{
  display:flex; align-items:center; gap:10px; background:var(--well);
  border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:14px;
}
.check input{width:20px; height:20px; accent-color:var(--gold)}
.check span{font-weight:500}
.sheet-btns{display:flex; gap:10px; margin-top:18px}
.btn{border:0; border-radius:14px; height:50px; padding:0 10px; font-weight:700; font-size:15.5px}
.btn-save{flex:2; background:var(--gold); color:var(--bg); box-shadow:0 0 18px rgba(232,190,14,.3)}
.btn-cancel{flex:1; background:none; color:var(--ink2); border:1px solid var(--line)}
.btn:disabled{opacity:.6; cursor:default}

/* ---------- login ---------- */
.login{
  max-width:400px; margin:34px auto 0; background:var(--paper); border:1px solid var(--line);
  border-radius:22px; padding:28px 22px; text-align:center;
}
.login h2{margin:0 0 4px; color:#fff; font-weight:800; font-size:21px}
.login p{margin:0 0 16px; color:var(--ink2); font-size:14px}
.login input{text-align:center; letter-spacing:.35em; font-weight:700; font-size:20px}
.login .btn-save{width:100%; margin-top:12px}
.login .err{color:var(--pink); font-size:13.5px; min-height:20px; margin-top:8px; font-weight:400}

/* ---------- add button / toast / misc ---------- */
.fab{
  position:fixed; bottom:18px; inset-inline-start:50%; transform:translateX(50%);
  z-index:30; border:0; border-radius:999px; padding:14px 28px;
  background:var(--gold); color:var(--bg); font-weight:700; font-size:15px;
  box-shadow:0 0 22px rgba(232,190,14,.35), 0 12px 28px -12px rgba(0,0,0,.9);
}
.toast{
  position:fixed; top:14px; inset-inline-start:50%; transform:translateX(50%);
  z-index:60; background:var(--paper2); color:#fff; border:1px solid var(--line); border-radius:999px;
  padding:9px 20px; font-size:14px; font-weight:400; white-space:nowrap; max-width:92vw;
  overflow:hidden; text-overflow:ellipsis;
}
.toast.ok{background:var(--gold); border-color:var(--gold); color:var(--bg); font-weight:600}
.toast.bad{background:var(--rasp); border-color:var(--rasp)}
.loading{text-align:center; color:var(--mut); padding:30px; font-size:14px}
.spin{
  display:inline-block; width:22px; height:22px; border-radius:50%;
  border:3px solid var(--paper2); border-top-color:var(--gold); vertical-align:middle;
  animation:spin .8s linear infinite; margin-inline-end:8px;
}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){ .spin{animation:none} }
@media (max-width:420px){
  .bar-label{width:118px; min-width:118px; font-size:12.5px}
  .hero h1{font-size:26px}
  .hero .logo{height:34px}
  .hero .eyebrow{font-size:11px; letter-spacing:.28em}
  .tab{font-size:12.5px; gap:4px}
  .tab .ico{width:16px; height:16px}
  .pick{font-size:14px}
}
</style>
</head>
<body>

<header class="hero">
  <div class="hero-in">
    <img class="logo" src="logo.png" alt="Shir Digital Marketing">
    <div class="eyebrow">ON THE TABLE</div>
    <h1>ניהול לידים</h1>
  </div>
</header>

<main class="wrap">

  <!-- מסך כניסה -->
  <section id="loginView" class="login" hidden>
    <h2>שלום אורטל 👋</h2>
    <p>הקלידי את קוד הכניסה שקיבלת משיר</p>
    <input id="pinInput" type="password" inputmode="numeric" autocomplete="off" placeholder="••••">
    <button class="btn btn-save" id="loginBtn">כניסה</button>
    <div class="err" id="loginErr"></div>
  </section>

  <!-- אפליקציה -->
  <section id="appView" hidden>
    <nav class="tabs" role="tablist">
      <button class="tab active" data-tab="leads" role="tab">לידים<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm-7 9a7 7 0 0 1 14 0v1H2v-1Zm15-9.5a3.5 3.5 0 1 0-1.6-6.6 6 6 0 0 1 0 6.2c.5.25 1 .4 1.6.4Zm1 10.5v-1a8.9 8.9 0 0 0-2.2-5.9A6 6 0 0 1 22 20v1h-4Z"/></svg></button>
      <button class="tab" data-tab="follow" role="tab">פולואפ להיום<svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4M8 14h.01M12 14h.01M16 14h.01M8 17.5h.01M12 17.5h.01M16 17.5h.01"/></svg><span class="badge" id="followBadge" hidden></span></button>
      <button class="tab" data-tab="summary" role="tab">סיכום<svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 21V11M10 21V4M15 21v-7M20 21V8"/></svg></button>
    </nav>

    <!-- לשונית לידים -->
    <div id="tab-leads">
      <div class="toolbar">
        <input id="searchInput" type="search" placeholder="חיפוש לפי שם או טלפון...">
        <button class="btn-icon" id="refreshBtn" title="רענון" aria-label="רענון">⟳</button>
      </div>
      <div class="chips" id="statusChips"></div>
      <div id="leadsList"></div>
    </div>

    <!-- לשונית פולואפ -->
    <div id="tab-follow" hidden>
      <div id="followList"></div>
    </div>

    <!-- לשונית סיכום -->
    <div id="tab-summary" hidden>
      <div class="tiles" id="tiles"></div>
      <div class="card"><div class="section-title" style="margin-top:2px">לפי סטטוס</div><div id="byStatus"></div></div>
      <div class="card"><div class="section-title" style="margin-top:2px">לפי מודעה</div><div id="byAd"></div></div>
    </div>
  </section>

  <div id="loadingView" class="loading" hidden><span class="spin"></span>טוענת לידים...</div>
  <div id="setupView" class="empty" hidden>הדף עוד לא חובר לטבלה.<br>חסרה כתובת API_URL בקובץ - זה שלב ההתקנה של שיר, לא תקלה אצלך.</div>
</main>

<button class="fab" id="addBtn" hidden>+ ליד חדש</button>

<!-- חלון עריכה / הוספה -->
<div class="overlay" id="overlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true">
    <h2 id="sheetTitle"></h2>
    <div class="sub" id="sheetSub"></div>

    <div id="newLeadFields" hidden>
      <div class="field"><label for="fName">שם מלא</label><input id="fName" type="text"></div>
      <div class="field"><label for="fPhone">טלפון</label><input id="fPhone" type="tel" inputmode="tel" placeholder="050-0000000"></div>
    </div>

    <div class="field"><span class="label">סטטוס</span><div class="picks" id="pStatus" role="group" aria-label="סטטוס"></div><input type="hidden" id="fStatus"></div>
    <input type="hidden" id="fReason">
    <!-- חלון התיעוד מציג רק סטטוסים. השדות האלה נשארים מוסתרים כי הלוגיקה נשענת עליהם:
         הדיווח של "לא רלוונטי" וסימון "נסגרה עסקה" עוברים דרכם; תאריך מעקב והערה נערכים בכרטיס עצמו. -->
    <div hidden>
    <div class="field"><label for="fEvent">תאריך האירוע</label><input id="fEvent" type="date"></div>
    <div class="field"><label for="fFollow">תאריך מעקב</label>
      <div class="dt"><input id="fFollow" type="date"><input id="fFollowTime" type="time" aria-label="שעת מעקב"></div>
    </div>
    <div class="field"><label for="fNotes">דיווח והערות</label><textarea id="fNotes" rows="3"></textarea></div>
    <label class="check"><input id="fClosed" type="checkbox"><span>נסגרה עסקה 🎉</span></label>
    <div class="field"><label for="fValue">שווי הזמנה ₪</label><input id="fValue" type="number" inputmode="decimal" min="0" step="1"></div>

    </div>
    <div class="sheet-btns">
      <button class="btn btn-save" id="saveBtn">שמירה</button>
      <button class="btn btn-cancel" id="cancelBtn">ביטול</button>
    </div>
  </div>
</div>

<!-- חלון "לא רלוונטי": סיבה + דיווח חובה לפני שמירה -->
<div class="overlay pop" id="outPop" hidden>
  <div class="popbox" role="dialog" aria-modal="true" aria-labelledby="outTitle">
    <h2 id="outTitle">למה הליד לא רלוונטי?</h2>
    <div class="sub">כדי לשמור צריך לבחור סיבה ולכתוב דיווח קצר</div>
    <div class="field"><span class="label">סיבת אי-סגירה</span><div class="picks" id="pReason" role="group" aria-label="סיבת אי-סגירה"></div></div>
    <div class="field"><label for="outNote">דיווח על הליד</label><textarea id="outNote" rows="3"></textarea></div>
    <div class="sheet-btns">
      <button class="btn btn-save" id="outSave" disabled>שמירה</button>
      <button class="btn btn-cancel" id="outCancel">ביטול</button>
    </div>
  </div>
</div>

<script>
'use strict';
/* כתובת ה-Web app של Apps Script - מודבקת אחרי הפריסה בגוגל */
const API_URL = 'https://script.google.com/macros/s/AKfycbw23hVet72TBIaXW-kwBbUiIQ1D_e5mBSRbFpaGQv8evaVkalt5IBjBoAi6Z-4VT3ON/exec';

const CLOSED_STATUS = 'הזמנה נסגרה';
const OUT_STATUS = 'לא רלוונטי';
const CONTACT_STATUS = 'נוצר קשר ראשוני';
const state = { pin:'', leads:[], statuses:[], reasons:[], statusColors:{}, reasonColors:{}, dirty:false, tab:'leads', filter:'', search:'', editing:null, adding:false };
const $ = id => document.getElementById(id);

/* ---------- API ---------- */
async function api(action, payload={}){
  const res = await fetch(API_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(Object.assign({pin:state.pin, action}, payload))
  });
  if(!res.ok) throw new Error('http_'+res.status);
  return res.json();
}

/* ---------- dates & phones ---------- */
function parseDate(s){                        // "14-09-2026" / "14/09/2026" / "14-09-2026 19:13"
  const m = /^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})/.exec(String(s||'').trim());
  return m ? new Date(+m[3], +m[2]-1, +m[1]) : null;
}
function toInputDate(s){
  const d = parseDate(s);
  return d ? d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0') : '';
}
function fmtDate(s){
  const d = parseDate(s);
  return d ? String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+d.getFullYear() : (s||'');
}
function toInputTime(s){                      // "04-10-2026 14:30" -> "14:30"
  const m = /\d{4}\D+(\d{1,2}):(\d{2})/.exec(String(s||''));
  return m ? m[1].padStart(2,'0')+':'+m[2] : '';
}
function joinFollow(date, time){ return date ? (time ? date+'T'+time : date) : ''; }
/* שולחים לשיטס רק שדות שהמשתמשת באמת שינתה. כך תא שהדף לא יודע לקרוא
   (למשל טקסט בעמודה שאמורה להכיל תאריך) לא נדרס בערך ריק בזמן שמירה של שדה אחר. */
function loadedValues(l){
  return {
    eventDate:toInputDate(l.eventDate), status:l.status||'', notes:l.notes||'',
    followup:joinFollow(toInputDate(l.followup), toInputTime(l.followup)),
    closed:!!l.closed, value:leadValue(l)>0 ? String(leadValue(l)) : ''
  };
}
function onlyChanged(fields, lead){
  const was=loadedValues(lead), out={};
  Object.keys(fields).forEach(k=>{ if(!(k in was) || String(fields[k])!==String(was[k])) out[k]=fields[k]; });
  return out;
}
function today0(){ const d=new Date(); d.setHours(0,0,0,0); return d; }
function phoneDigits(p){ let d=String(p||'').replace(/\D/g,''); if(d.startsWith('972')) d='0'+d.slice(3); return d; }
function fmtPhone(p){ const d=phoneDigits(p); return d.length===10 ? d.slice(0,3)+'-'+d.slice(3) : (d||''); }
function waLink(p){ let d=String(p||'').replace(/\D/g,''); if(d.startsWith('0')) d='972'+d.slice(1); return 'https://wa.me/'+d; }
function money(n){ return '₪' + Number(n||0).toLocaleString('he-IL'); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------- lead helpers ---------- */
function isClosed(l){ return l.closed || l.status===CLOSED_STATUS; }
function isOut(l){ return l.status===OUT_STATUS; }
function leadValue(l){ const n=Number(String(l.value||'').replace(/[^\d.\-]/g,'')); return isNaN(n)?0:n; }
/* צבעי הסטטוסים והסיבות - מקור אחד לכפתורים ולתוויות, כדי שיהיו זהים בכל הדף.
   קודם כל הצבע מהשיטס (מגיע מה-API, לפי העיצוב המותנה של העמודה). הטבלה כאן היא גיבוי
   לערך שאין לו צבע בשיטס, ומי שאין לו גם כאן מקבל את צבע ברירת המחדל. */
const DEFAULT_COLOR = '#B79CB4';
const STATUS_COLORS = {
  'חדש':'#C0289B', 'נוצר קשר ראשוני':'#7FD1FF', 'אין מענה 1':'#FF9A3D', 'אין מענה 2':'#FF9A3D', 'אין מענה 3':'#FF9A3D',
  'מעוניינת - לחזור בהמשך':'#B694FF', 'נשלחה הצעה':'#F3A6DD',
  'הזמנה נסגרה':'#E8BE0E', 'לא רלוונטי':'#8E7F93'
};
const REASON_COLORS = {};
function isHex(c){ return /^#[0-9a-f]{6}$/i.test(c||''); }
function onColor(hex){                       // טקסט כהה על צבע בהיר, לבן על צבע כהה
  const n=parseInt(hex.slice(1),16), r=n>>16, g=(n>>8)&255, b=n&255;
  return (0.299*r + 0.587*g + 0.114*b) > 150 ? '#170322' : '#FFFFFF';
}
function colorStyle(kind, name){
  const sheet = (kind==='status' ? state.statusColors : state.reasonColors)[name] || {};
  const local = (kind==='status' ? STATUS_COLORS : REASON_COLORS)[name] || DEFAULT_COLOR;
  const c = isHex(sheet.bg) ? sheet.bg : isHex(sheet.fg) ? sheet.fg : local;
  const on = isHex(sheet.bg) && isHex(sheet.fg) ? sheet.fg : onColor(c);
  return 'style="--c:'+c+';--on:'+on+'"';
}
function needsFollow(l){
  if(isClosed(l)||isOut(l)) return false;
  const d = parseDate(l.followup);
  return !!d && d <= today0();
}

/* ---------- toast ---------- */
let toastTimer=null;
function toast(msg, kind){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const t=document.createElement('div');
  t.className='toast'+(kind?' '+kind:''); t.textContent=msg;
  document.body.appendChild(t);
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.remove(), 2600);
}

/* ---------- rendering ---------- */
const ICON = {
  cal:'<svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4M8 15h.01M12 15h.01"/></svg>',
  phone:'<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25c1.1.37 2.3.57 3.6.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1.02L6.6 10.8Z"/></svg>',
  flag:'<svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 5h13l-2.5 4L18 13H5"/></svg>',
  note:'<svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h7l5 5v13H7zM14 3v5h5M10 13h6M10 17h6"/></svg>',
  check:'<svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  chev:'<svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
  wa:'<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>'
};

function leadCard(l){
  const extra=[];
  if(parseDate(l.eventDate)) extra.push('<span>אירוע '+esc(fmtDate(l.eventDate))+'</span>');
  if(leadValue(l)>0) extra.push('<span>שווי '+esc(money(leadValue(l)))+'</span>');
  if(l.reason && isOut(l)) extra.push('<span>סיבה: '+esc(l.reason)+'</span>');
  const digits = phoneDigits(l.phone);
  const status = l.status||'חדש';
  return '<div class="card lead" data-row="'+l.row+'">'+
    '<div class="lead-id">'+
      (l.created?'<div class="lead-date num">'+ICON.cal+esc(fmtDate(l.created))+'</div>':'')+
      '<div class="lead-name">'+esc(l.name||'(ללא שם)')+'</div>'+
      (digits?'<div class="lead-phone num">'+ICON.phone+esc(fmtPhone(l.phone))+'</div>':'')+
      '<span class="pill" '+colorStyle('status', status)+'>'+esc(status)+'</span>'+
      (extra.length?'<div class="lead-extra num">'+extra.join(' · ')+'</div>':'')+
    '</div>'+
    '<div class="lead-side">'+
      (digits?'<a class="round wa" href="'+waLink(l.phone)+'" target="_blank" rel="noopener" aria-label="וואטסאפ">'+ICON.wa+'</a>':'')+
      (digits?'<a class="round" href="tel:'+digits+'" data-call="'+l.row+'" aria-label="חיוג">'+ICON.phone+'</a>':'')+
    '</div>'+
    '<div class="lead-form">'+
      '<div class="lf wide"><div class="lf-label">'+ICON.flag+'סטטוס</div>'+
        '<button type="button" class="doc-btn" data-edit="'+l.row+'">תיעוד ליד'+ICON.chev+'</button></div>'+
      '<div class="lf wide"><label class="lf-label" for="qf'+l.row+'">'+ICON.cal+'תאריך מעקב</label>'+
        '<div class="dt"><input type="date" id="qf'+l.row+'" data-q="followup" value="'+esc(toInputDate(l.followup))+'"'+(needsFollow(l)?' class="due"':'')+'>'+
        '<input type="time" data-q="followTime" aria-label="שעת מעקב" value="'+esc(toInputTime(l.followup))+'"></div></div>'+
      '<div class="lf wide"><label class="lf-label" for="qn'+l.row+'">'+ICON.note+'הערה</label>'+
        '<input type="text" id="qn'+l.row+'" data-q="notes" value="'+esc(l.notes||'')+'" placeholder="הערה על הליד..."></div>'+
      '<button type="button" class="lf-save" data-save="'+l.row+'">'+ICON.check+'שמור</button>'+
    '</div></div>';
}

function renderChips(){
  const counts={};
  state.leads.forEach(l=>{ const s=l.status||'חדש'; counts[s]=(counts[s]||0)+1; });
  let html='<button class="chip'+(state.filter===''?' active':'')+'" data-f="">הכל ('+state.leads.length+')</button>';
  state.statuses.forEach(s=>{
    html+='<button class="chip'+(state.filter===s?' active':'')+'" data-f="'+esc(s)+'">'+esc(s)+(counts[s]?' ('+counts[s]+')':'')+'</button>';
  });
  $('statusChips').innerHTML=html;
}

function renderLeads(){
  const q=state.search.trim();
  let list=state.leads.slice().sort((a,b)=>b.row-a.row);
  if(state.filter) list=list.filter(l=>(l.status||'חדש')===state.filter);
  if(q) list=list.filter(l=>(l.name||'').includes(q) || phoneDigits(l.phone).includes(q.replace(/\D/g,'')||'␀'));
  $('leadsList').innerHTML = list.length ? list.map(leadCard).join('') :
    '<div class="empty">'+(state.leads.length?'לא נמצאו לידים מתאימים לסינון.':'אין עדיין לידים - ברגע שייכנס ליד מהקמפיין הוא יופיע כאן.')+'</div>';
}

function renderFollow(){
  const due=state.leads.filter(needsFollow).sort((a,b)=>{
    return (parseDate(a.followup)||0) - (parseDate(b.followup)||0);
  });
  const overdue=due.filter(l=>parseDate(l.followup) < today0());
  const todayList=due.filter(l=>+parseDate(l.followup) === +today0());
  let html='';
  if(overdue.length) html+='<div class="section-title">באיחור <span class="count">'+overdue.length+'</span></div>'+overdue.map(leadCard).join('');
  if(todayList.length) html+='<div class="section-title">להיום <span class="count">'+todayList.length+'</span></div>'+todayList.map(leadCard).join('');
  if(!due.length) html='<div class="empty">אין פולואפים להיום ✨<br>כל ליד שנקבע לו תאריך פולואפ יופיע כאן ביום שלו.</div>';
  $('followList').innerHTML=html;
  const b=$('followBadge');
  b.hidden = !due.length;
  b.textContent = due.length;
}

function renderSummary(){
  const total=state.leads.length;
  const closed=state.leads.filter(isClosed);
  const sum=closed.reduce((a,l)=>a+leadValue(l),0);
  const pct= total ? Math.round(closed.length/total*100) : 0;
  $('tiles').innerHTML=
    '<div class="tile"><div class="big num">'+total+'</div><div class="cap">לידים סה"כ</div></div>'+
    '<div class="tile"><div class="big num">'+closed.length+'</div><div class="cap">עסקאות שנסגרו</div></div>'+
    '<div class="tile"><div class="big num">'+pct+'%</div><div class="cap">אחוז סגירה</div></div>'+
    '<div class="tile gold"><div class="big num">'+money(sum)+'</div><div class="cap">שווי הזמנות כולל</div></div>';

  const byS={};
  state.leads.forEach(l=>{ const s=l.status||'חדש'; byS[s]=(byS[s]||0)+1; });
  const orderedS=[...state.statuses.filter(s=>byS[s]), ...Object.keys(byS).filter(s=>!state.statuses.includes(s))];
  $('byStatus').innerHTML = orderedS.length ? orderedS.map(s=>barRow(s, byS[s], total)).join('') :
    '<div class="empty" style="box-shadow:none;padding:14px">אין עדיין נתונים</div>';

  const byA={};
  state.leads.forEach(l=>{ const a=l.ad||l.campaign||'ללא שיוך'; byA[a]=(byA[a]||0)+1; });
  const ads=Object.entries(byA).sort((x,y)=>y[1]-x[1]);
  $('byAd').innerHTML = ads.length ? ads.map(([a,c])=>barRow(a,c,total)).join('') :
    '<div class="empty" style="box-shadow:none;padding:14px">אין עדיין נתונים</div>';
}
function barRow(label,count,total){
  const w= total ? Math.max(4, Math.round(count/total*100)) : 0;
  return '<div class="bar-row"><div class="bar-label">'+esc(label)+'</div>'+
    '<div class="bar-track"><div class="bar-fill" style="width:'+w+'%"></div></div>'+
    '<div class="bar-num num">'+count+'</div></div>';
}

function renderAll(){ state.dirty=false; renderChips(); renderLeads(); renderFollow(); renderSummary(); }

/* שמירה מהירה מהכרטיס: תאריך מעקב + הערה, בלי לפתוח את חלון התיעוד.
   state.dirty מסמן שיש הקלדה שלא נשמרה - כל עוד הוא דולק, הרענון האוטומטי לא דורס אותה. */
document.addEventListener('input', e=>{ if(e.target.closest('.lead-form')) state.dirty=true; });
async function quickSave(lead, card, btn){
  const date=card.querySelector('[data-q=followup]').value, time=card.querySelector('[data-q=followTime]').value;
  if(!date && time){ toast('כדי לשמור שעה צריך לבחור גם תאריך','bad'); return; }
  const fields=onlyChanged({ followup:joinFollow(date,time), notes:card.querySelector('[data-q=notes]').value }, lead);
  if(!Object.keys(fields).length){ state.dirty=false; toast('אין שינויים לשמירה'); return; }
  btn.disabled=true;
  try{
    const res=await api('update',{row:lead.row, expect:{name:lead.name, phone:lead.phone}, fields});
    if(res.ok){ state.dirty=false; toast('נשמר בטבלה ✓','ok'); await loadLeads(false); }
    else if(res.error==='row_mismatch'){ state.dirty=false; toast('הטבלה השתנתה בינתיים - הרשימה רועננה, נסי שוב','bad'); await loadLeads(false); }
    else if(res.error==='bad_pin') logout();
    else toast('השמירה נכשלה - נסי שוב','bad');
  }catch(err){
    toast('אין חיבור - בדקי אינטרנט ונסי שוב','bad');
  }finally{
    btn.disabled=false;
  }
}

/* ---------- tabs ---------- */
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  state.tab=t.dataset.tab;
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===t));
  ['leads','follow','summary'].forEach(n=>$('tab-'+n).hidden = n!==state.tab);
}));

/* ---------- edit / add sheet ---------- */
/* בחירה בכפתורים במקום תפריט נפתח. לחיצה נוספת על הכפתור הנבחר מנקה את הבחירה.
   ערך שקיים בשיטס ואינו ברשימה מוצג גם הוא, כדי שלא יימחק בשמירה. */
function fillPicks(boxId, inputId, items, current){
  const list = current && !items.includes(current) ? items.concat([current]) : items;
  const kind = inputId==='fStatus' ? 'status' : 'reason';
  $(boxId).innerHTML = list.map(s=>'<button type="button" class="pick" data-v="'+esc(s)+'" '+colorStyle(kind,s)+'>'+esc(s)+'</button>').join('');
  setPick(boxId, inputId, current||'');
}
function setPick(boxId, inputId, value){
  $(inputId).value = value;
  $(boxId).classList.toggle('has-on', !!value);
  $(boxId).querySelectorAll('.pick').forEach(b=>{ const on=b.dataset.v===value; b.classList.toggle('on',on); b.setAttribute('aria-pressed',on); });
}
$('pStatus').addEventListener('click', e=>{
  const b=e.target.closest('.pick'); if(!b) return;
  if(b.dataset.v===OUT_STATUS){ openOutPop(); return; }   // הסטטוס נקבע רק אחרי שמולאו סיבה ודיווח
  setPick('pStatus','fStatus', $('fStatus').value===b.dataset.v ? '' : b.dataset.v);
  if($('fStatus').value===CLOSED_STATUS) $('fClosed').checked=true;
});
$('pReason').addEventListener('click', e=>{
  const b=e.target.closest('.pick'); if(!b) return;
  setPick('pReason','fReason', $('fReason').value===b.dataset.v ? '' : b.dataset.v);
  refreshOutSave();
});

/* ---------- "לא רלוונטי": סיבה + דיווח חובה ---------- */
function refreshOutSave(){ $('outSave').disabled = !$('fReason').value || !$('outNote').value.trim(); }
function openOutPop(){
  fillPicks('pReason','fReason', state.reasons, $('fReason').value);
  $('outNote').value = $('fNotes').value;
  refreshOutSave();
  $('outPop').hidden=false;
}
$('outNote').addEventListener('input', refreshOutSave);
$('outCancel').addEventListener('click', ()=>{
  $('outPop').hidden=true;
  $('fReason').value = state.editing ? (state.editing.reason||'') : '';
});
$('outSave').addEventListener('click', ()=>{
  $('fNotes').value = $('outNote').value.trim();
  setPick('pStatus','fStatus', OUT_STATUS);
  $('outPop').hidden=true;
  $('saveBtn').click();
});
function openEdit(lead){
  state.editing=lead; state.adding=!lead;
  $('newLeadFields').hidden=!!lead;
  $('sheetTitle').textContent = lead ? lead.name||'(ללא שם)' : 'ליד חדש';
  $('sheetSub').textContent = lead ? fmtPhone(lead.phone)+(lead.created?' · הגיע '+fmtDate(lead.created):'') : 'הליד יתווסף גם לטבלה';
  fillPicks('pStatus','fStatus', state.statuses, lead ? lead.status : (state.statuses.includes('חדש')?'חדש':''));
  $('fReason').value = lead ? (lead.reason||'') : '';
  if(!lead){ $('fName').value=''; $('fPhone').value=''; }
  $('fEvent').value = lead?toInputDate(lead.eventDate):'';
  $('fFollow').value = lead?toInputDate(lead.followup):'';
  $('fFollowTime').value = lead?toInputTime(lead.followup):'';
  $('fNotes').value = lead?(lead.notes||''):'';
  $('fClosed').checked = lead?!!lead.closed:false;
  $('fValue').value = lead&&leadValue(lead)>0?leadValue(lead):'';
  $('overlay').hidden=false;
  document.body.style.overflow='hidden';
}
function closeEdit(){ $('overlay').hidden=true; state.editing=null; state.adding=false; document.body.style.overflow=''; }
$('cancelBtn').addEventListener('click', closeEdit);
$('overlay').addEventListener('click', e=>{ if(e.target===$('overlay')) closeEdit(); });


$('saveBtn').addEventListener('click', async ()=>{
  const btn=$('saveBtn'); btn.disabled=true; btn.textContent='שומרת...';
  const fields={
    eventDate:$('fEvent').value, status:$('fStatus').value,
    notes:$('fNotes').value, followup:joinFollow($('fFollow').value, $('fFollowTime').value),
    closed:$('fClosed').checked, value:$('fValue').value
  };
  /* סיבה נכתבת רק עם "לא רלוונטי". ליד שיוצא מהסטטוס הזה - הסיבה מתנקה.
     בכל מקרה אחר לא נוגעים בעמודת הסיבה, כדי לא למחוק מידע קיים בשיטס. */
  if(fields.status===OUT_STATUS) fields.reason=$('fReason').value;
  else if(state.editing && state.editing.status===OUT_STATUS) fields.reason='';
  try{
    if(!$('fFollow').value && $('fFollowTime').value){ toast('כדי לשמור שעה צריך לבחור גם תאריך','bad'); return; }
    if(fields.status===OUT_STATUS && (!fields.reason || !fields.notes.trim())){ openOutPop(); return; }
    let res;
    if(state.adding){
      const name=$('fName').value.trim(), phone=$('fPhone').value.trim();
      if(!name && !phone){ toast('צריך לפחות שם או טלפון','bad'); return; }
      res=await api('add',{fields:Object.assign({name,phone},fields)});
    }else{
      const l=state.editing;
      const changed=onlyChanged(fields, l);
      if(!Object.keys(changed).length){ closeEdit(); toast('אין שינויים לשמירה'); return; }
      res=await api('update',{row:l.row, expect:{name:l.name, phone:l.phone}, fields:changed});
    }
    if(res.ok){
      closeEdit(); toast('נשמר בטבלה ✓','ok'); await loadLeads(false);
    }else if(res.error==='row_mismatch'){
      closeEdit(); toast('הטבלה השתנתה בינתיים - הרשימה רועננה, נסי שוב','bad'); await loadLeads(false);
    }else if(res.error==='bad_pin'){
      logout();
    }else{
      toast('השמירה נכשלה - נסי שוב','bad');
    }
  }catch(err){
    toast('אין חיבור - בדקי אינטרנט ונסי שוב','bad');
  }finally{
    btn.disabled=false; btn.textContent='שמירה';
  }
});

/* ---------- events ---------- */
$('addBtn').addEventListener('click', ()=>openEdit(null));
$('refreshBtn').addEventListener('click', ()=>loadLeads(false));
$('searchInput').addEventListener('input', e=>{ state.search=e.target.value; renderLeads(); });
$('statusChips').addEventListener('click', e=>{
  const c=e.target.closest('.chip'); if(!c) return;
  state.filter=c.dataset.f; renderChips(); renderLeads();
});
/* לחיצה על "חיוג" מסמנת אוטומטית "נוצר קשר ראשוני" - רק לליד שעוד לא טופל (בלי סטטוס או "חדש"),
   כדי שחיוג חוזר לליד מתקדם לא יחזיר אותו אחורה. החיוג עצמו לא מתעכב בגלל העדכון. */
async function markContacted(lead){
  if(lead.status && lead.status!=='חדש') return;
  if(!state.statuses.includes(CONTACT_STATUS)) return;
  try{
    const res=await api('update',{row:lead.row, expect:{name:lead.name, phone:lead.phone}, fields:{status:CONTACT_STATUS}});
    if(res.ok){
      lead.status=CONTACT_STATUS;
      if(state.dirty){              // יש הקלדה שלא נשמרה - מעדכנים רק את התווית, לא מציירים מחדש
        document.querySelectorAll('.lead[data-row="'+lead.row+'"] .pill').forEach(el=>{ el.outerHTML='<span class="pill" '+colorStyle('status',CONTACT_STATUS)+'>'+esc(CONTACT_STATUS)+'</span>'; });
      }else renderAll();
      toast('סטטוס עודכן: '+CONTACT_STATUS,'ok');
    }
    else if(res.error==='bad_pin') logout();
    else await loadLeads(false);
  }catch(err){
    toast('החיוג יצא, אבל הסטטוס לא עודכן - אין חיבור','bad');
  }
}

document.addEventListener('click', e=>{
  const call=e.target.closest('[data-call]');
  if(call){
    const called=state.leads.find(l=>l.row===+call.dataset.call);
    if(called) markContacted(called);
    return;
  }
  const save=e.target.closest('[data-save]');
  if(save){
    const l=state.leads.find(x=>x.row===+save.dataset.save);
    if(l) quickSave(l, save.closest('.lead'), save);
    return;
  }
  const btn=e.target.closest('[data-edit]');
  if(!btn) return;
  const lead=state.leads.find(l=>l.row===+btn.dataset.edit);
  if(lead) openEdit(lead);
});

/* ---------- deep link ---------- */
/* קישור מההתראה בוואטסאפ: #lead=<מספר שורה בשיטס>. מספר שורה ולא טלפון - כדי שפרטי הליד לא יופיעו בקישור.
   נפתח פעם אחת לכל קישור, אחרת הרענון האוטומטי היה פותח את החלון מחדש כל 2 דקות. */
let hashHandled=false;
function openLeadFromHash(){
  const m=/^#lead=(\d+)$/.exec(location.hash);
  if(!m || hashHandled) return;
  hashHandled=true;
  const lead=state.leads.find(l=>l.row===+m[1]);
  if(lead) openEdit(lead);
  else toast('הליד מהקישור לא נמצא - חפשי אותו ברשימה','bad');
}
window.addEventListener('hashchange', ()=>{
  hashHandled=false;
  if(state.pin && !$('appView').hidden && $('overlay').hidden) openLeadFromHash();
});

/* ---------- load & login ---------- */
async function loadLeads(showSpinner){
  if(showSpinner) $('loadingView').hidden=false;
  try{
    const res=await api('list');
    if(res.ok){
      state.leads=res.leads||[]; state.statuses=res.statuses||[]; state.reasons=res.reasons||[];
      state.statusColors=res.statusColors||{}; state.reasonColors=res.reasonColors||{};
      renderAll();
      $('appView').hidden=false; $('addBtn').hidden=false; $('loginView').hidden=true;
      openLeadFromHash();
      return true;
    }
    if(res.error==='bad_pin'){ logout(); return false; }
    toast('הטעינה נכשלה - נסי לרענן','bad'); return false;
  }catch(err){
    toast('אין חיבור לטבלה - בדקי אינטרנט','bad'); return false;
  }finally{
    $('loadingView').hidden=true;
  }
}

function logout(){
  try{ localStorage.removeItem('otb_pin'); }catch(e){}
  state.pin='';
  $('appView').hidden=true; $('addBtn').hidden=true; $('loginView').hidden=false;
  $('loginErr').textContent='הקוד לא נכון או התחלף - נסי שוב';
}

async function tryLogin(pin){
  state.pin=pin;
  $('loginBtn').disabled=true; $('loginBtn').textContent='בודקת...'; $('loginErr').textContent='';
  const ok=await loadLeads(false);
  $('loginBtn').disabled=false; $('loginBtn').textContent='כניסה';
  if(ok){ try{ localStorage.setItem('otb_pin', pin); }catch(e){} }
  else if(!$('loginErr').textContent){ $('loginErr').textContent='הקוד לא נכון'; }
}
$('loginBtn').addEventListener('click', ()=>{ const p=$('pinInput').value.trim(); if(p) tryLogin(p); });
$('pinInput').addEventListener('keydown', e=>{ if(e.key==='Enter'){ const p=$('pinInput').value.trim(); if(p) tryLogin(p); } });

/* רענון אוטומטי כל 2 דקות כשהדף פתוח */
setInterval(()=>{ if(!document.hidden && state.pin && $('overlay').hidden && !state.dirty) loadLeads(false); }, 120000);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && state.pin && $('overlay').hidden && !state.dirty) loadLeads(false); });

/* ---------- init ---------- */
(function init(){
  if(!API_URL || API_URL.indexOf('PASTE_') === 0){ $('setupView').hidden=false; return; }
  let saved=''; try{ saved=localStorage.getItem('otb_pin')||''; }catch(e){}
  if(saved){ state.pin=saved; $('loadingView').hidden=false; loadLeads(true).then(ok=>{ if(!ok) $('loginView').hidden=false; }); }
  else $('loginView').hidden=false;
})();
</script>
</body>
</html>
