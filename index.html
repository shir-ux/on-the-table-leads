<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>On The Table - ניהול לידים</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💜</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700;800&display=swap">
<style>
:root{
  --page:#F7F2FA; --panel:#FFFFFF; --panel-2:#F6EDF5;
  --purple-deep:#3A0A50; --purple-mid:#6C0F7E; --magenta:#8C1383; --magenta-accent:#B0187F;
  --gold:#E8BE0E; --ink:#2A1430; --ink-soft:#93809B; --line:#EFE4EE; --row-hl:#FBF0F6;
  --text-light:#F0DEF0;
  --ok:#1E7B4F; --ok-bg:#E5F4EC; --warn:#9A6A08; --warn-bg:#FBF3DC;
  --grey:#6E6472; --grey-bg:#F0ECF1; --danger:#B3261E;
  --shadow:0 5px 16px rgba(76,11,99,.07); --shadow-lift:0 8px 26px rgba(108,15,126,.22);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--page); color:var(--ink);
  font-family:'Rubik','Heebo',Arial,sans-serif; font-weight:300;
  font-size:16px; line-height:1.55; min-height:100vh;
}
button{font-family:inherit; font-size:inherit; cursor:pointer}
input,select,textarea{
  font-family:inherit; font-size:16px; color:var(--ink);
  background:#fff; border:1px solid var(--line); border-radius:10px;
  padding:10px 12px; width:100%;
}
input:focus,select:focus,textarea:focus,button:focus-visible{
  outline:2px solid var(--magenta-accent); outline-offset:1px;
}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}

/* ---------- header ---------- */
.hero{
  color:#fff; padding:20px 18px 16px; text-align:center;
  background-image:
    radial-gradient(rgba(232,190,14,.14) 1.3px, transparent 1.6px),
    radial-gradient(120% 90% at 12% -10%, rgba(232,190,14,.18), transparent 45%),
    linear-gradient(135deg,#4A0B63,#8C1383 55%,#B0187F);
  background-size:20px 20px,100% 100%,100% 100%;
  background-repeat:repeat,no-repeat,no-repeat;
  box-shadow:var(--shadow-lift);
}
.hero .eyebrow{color:var(--gold); font-weight:500; font-size:12px; letter-spacing:.3em}
.hero h1{margin:2px 0 0; font-weight:800; font-size:26px; line-height:1.15}
.hero .sub{color:var(--text-light); font-size:13px; margin-top:2px}

.wrap{max-width:640px; margin:0 auto; padding:0 14px 90px}

/* ---------- tabs ---------- */
.tabs{
  display:flex; gap:6px; background:var(--panel); border-radius:14px; padding:5px;
  margin:-16px auto 14px; position:relative; box-shadow:var(--shadow); max-width:612px;
}
.tab{
  flex:1; border:0; background:none; border-radius:10px; padding:9px 4px;
  font-weight:500; font-size:14px; color:var(--ink-soft); position:relative;
}
.tab.active{background:linear-gradient(135deg,var(--magenta),var(--magenta-accent)); color:#fff; font-weight:700}
.tab .badge{
  display:inline-flex; align-items:center; justify-content:center;
  min-width:18px; height:18px; border-radius:9px; padding:0 5px;
  background:var(--gold); color:var(--purple-deep); font-size:11px; font-weight:800;
  vertical-align:2px; margin-inline-start:3px;
}
.tab.active .badge{background:#fff}

/* ---------- toolbar ---------- */
.toolbar{display:flex; gap:8px; margin-bottom:10px}
.toolbar input{flex:1}
.btn-icon{
  width:44px; min-width:44px; height:44px; border-radius:10px; border:1px solid var(--line);
  background:var(--panel); color:var(--magenta); font-size:18px; box-shadow:var(--shadow);
}
.chips{display:flex; gap:6px; overflow-x:auto; padding:2px 0 10px; -webkit-overflow-scrolling:touch}
.chip{
  border:1px solid var(--line); background:var(--panel); color:var(--ink);
  border-radius:999px; padding:5px 12px; font-size:13px; white-space:nowrap; font-weight:400;
}
.chip.active{background:var(--purple-deep); border-color:var(--purple-deep); color:#fff; font-weight:500}

/* ---------- cards ---------- */
.card{
  background:var(--panel); border-radius:16px; box-shadow:var(--shadow);
  padding:13px 15px; margin-bottom:10px;
}
.lead{cursor:pointer}
.lead-top{display:flex; align-items:flex-start; justify-content:space-between; gap:8px}
.lead-name{font-weight:700; font-size:16.5px; color:var(--purple-deep)}
.lead-meta{color:var(--ink-soft); font-size:12.5px; margin-top:1px}
.lead-meta span{white-space:nowrap}
bdi{unicode-bidi:isolate}
.pill{
  display:inline-block; border-radius:999px; padding:3px 11px; font-size:12.5px; font-weight:500;
  white-space:nowrap; flex-shrink:0;
}
.p-new{background:linear-gradient(135deg,var(--magenta),var(--magenta-accent)); color:#fff; font-weight:700}
.p-wait{background:var(--warn-bg); color:var(--warn)}
.p-interest{background:#EFE3F5; color:var(--purple-mid)}
.p-offer{background:#FDF4D2; color:#7A5C05}
.p-closed{background:var(--ok-bg); color:var(--ok); font-weight:700}
.p-out{background:var(--grey-bg); color:var(--grey)}
.lead-rows{display:flex; flex-wrap:wrap; gap:4px 16px; margin-top:8px; font-size:13.5px}
.lead-rows .lbl{color:var(--ink-soft); margin-inline-end:4px}
.lead-note{
  margin-top:8px; background:var(--panel-2); border-radius:9px; padding:6px 10px;
  font-size:13px; color:var(--ink); border-inline-start:3px solid var(--gold);
  white-space:pre-wrap; overflow-wrap:anywhere;
}
.lead-actions{display:flex; gap:8px; margin-top:10px}
.act{
  flex:1; display:flex; align-items:center; justify-content:center; gap:6px;
  border:1px solid var(--line); background:#fff; border-radius:10px; padding:8px 4px;
  font-size:13.5px; font-weight:500; color:var(--purple-mid); text-decoration:none;
}
.act.primary{background:var(--purple-deep); border-color:var(--purple-deep); color:#fff}
.overdue{color:var(--danger); font-weight:500}

.section-title{
  display:flex; align-items:center; gap:8px; margin:18px 2px 8px;
  color:var(--purple-deep); font-weight:700; font-size:15px;
}
.section-title .count{
  background:var(--panel-2); color:var(--magenta); border-radius:999px;
  font-size:12px; font-weight:700; padding:1px 9px;
}
.empty{
  text-align:center; color:var(--ink-soft); padding:36px 10px; font-size:14.5px;
  background:var(--panel); border-radius:16px; box-shadow:var(--shadow);
}

/* ---------- summary ---------- */
.tiles{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px}
.tile{
  background:var(--panel); border-radius:16px; box-shadow:var(--shadow);
  padding:14px 12px 12px; text-align:center; min-height:96px;
  display:flex; flex-direction:column; justify-content:flex-start; gap:2px;
}
.tile .big{font-weight:800; font-size:30px; color:var(--magenta); line-height:1.1}
.tile.gold .big{color:#8A6D06}
.tile .cap{color:var(--ink-soft); font-size:12.5px; font-weight:400}
.bar-row{display:flex; align-items:center; gap:10px; padding:7px 0; border-bottom:1px solid var(--line)}
.bar-row:last-child{border-bottom:0}
.bar-label{width:150px; min-width:150px; font-size:13.5px}
.bar-track{flex:1; height:10px; background:var(--panel-2); border-radius:5px; overflow:hidden}
.bar-fill{height:100%; border-radius:5px; background:linear-gradient(90deg,var(--magenta-accent),var(--magenta))}
.bar-num{width:30px; min-width:30px; text-align:left; font-size:13px; font-weight:700; color:var(--purple-deep)}

/* ---------- modal (bottom sheet) ---------- */
.overlay{
  position:fixed; inset:0; background:rgba(42,20,48,.45); z-index:40;
  display:flex; align-items:flex-end; justify-content:center;
}
.sheet{
  background:var(--page); width:100%; max-width:640px; max-height:92vh; overflow-y:auto;
  border-radius:22px 22px 0 0; padding:18px 18px 26px;
}
.sheet h2{margin:0 0 2px; font-size:19px; font-weight:800; color:var(--purple-deep)}
.sheet .sub{color:var(--ink-soft); font-size:13px; margin-bottom:14px}
.field{margin-bottom:12px}
.field label{display:block; font-size:13px; font-weight:500; color:var(--purple-mid); margin-bottom:4px}
.field-row{display:flex; gap:10px}
.field-row .field{flex:1}
.check{
  display:flex; align-items:center; gap:10px; background:var(--panel);
  border:1px solid var(--line); border-radius:10px; padding:11px 12px; margin-bottom:12px;
}
.check input{width:20px; height:20px; accent-color:var(--magenta)}
.check span{font-weight:500}
.sheet-btns{display:flex; gap:10px; margin-top:16px}
.btn{
  border:0; border-radius:12px; padding:13px 10px; font-weight:700; font-size:15.5px;
}
.btn-save{flex:2; background:linear-gradient(135deg,var(--magenta),var(--magenta-accent)); color:#fff; box-shadow:0 3px 9px rgba(140,19,131,.3)}
.btn-cancel{flex:1; background:var(--panel); color:var(--ink-soft); border:1px solid var(--line)}
.btn:disabled{opacity:.6; cursor:default}

/* ---------- login ---------- */
.login{
  max-width:400px; margin:34px auto 0; background:var(--panel); border-radius:20px;
  box-shadow:var(--shadow); padding:26px 22px; text-align:center;
}
.login h2{margin:0 0 4px; color:var(--purple-deep); font-weight:800; font-size:20px}
.login p{margin:0 0 16px; color:var(--ink-soft); font-size:14px}
.login input{text-align:center; letter-spacing:.35em; font-weight:700; font-size:20px}
.login .btn-save{width:100%; margin-top:12px}
.login .err{color:var(--danger); font-size:13.5px; min-height:20px; margin-top:8px; font-weight:400}

/* ---------- add button / toast / misc ---------- */
.fab{
  position:fixed; bottom:18px; inset-inline-start:50%; transform:translateX(50%);
  z-index:30; border:0; border-radius:999px; padding:13px 26px;
  background:var(--purple-deep); color:#fff; font-weight:700; font-size:15px;
  box-shadow:var(--shadow-lift);
}
.toast{
  position:fixed; top:14px; inset-inline-start:50%; transform:translateX(50%);
  z-index:60; background:var(--ink); color:#fff; border-radius:999px;
  padding:9px 20px; font-size:14px; box-shadow:var(--shadow-lift); font-weight:400;
}
.toast.ok{background:var(--ok)}
.toast.bad{background:var(--danger)}
.loading{text-align:center; color:var(--ink-soft); padding:30px; font-size:14px}
.spin{
  display:inline-block; width:22px; height:22px; border-radius:50%;
  border:3px solid var(--panel-2); border-top-color:var(--magenta); vertical-align:middle;
  animation:spin .8s linear infinite; margin-inline-end:8px;
}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){ .spin{animation:none} }
@media (max-width:420px){
  .bar-label{width:118px; min-width:118px; font-size:12.5px}
  .hero h1{font-size:23px}
}
</style>
</head>
<body>

<header class="hero">
  <div class="eyebrow">ON THE TABLE</div>
  <h1>ניהול לידים</h1>
  <div class="sub">מגשי אירוח · מעודכן ישירות מול הטבלה</div>
</header>

<main class="wrap">

  <!-- מסך כניסה -->
  <section id="loginView" class="login" hidden>
    <h2>שלום אורטל 👋</h2>
    <p>הקלידי את קוד הכניסה שקיבלת משיר</p>
    <input id="pinInput" type="password" inputmode="numeric" autocomplete="off" placeholder="••••">
    <button class="btn btn-save" id="loginBtn">כניסה</button>
    <div class="err" id="loginErr"></div>
  </section>

  <!-- אפליקציה -->
  <section id="appView" hidden>
    <nav class="tabs" role="tablist">
      <button class="tab active" data-tab="leads" role="tab">לידים</button>
      <button class="tab" data-tab="follow" role="tab">פולואפ להיום <span class="badge" id="followBadge" hidden></span></button>
      <button class="tab" data-tab="summary" role="tab">סיכום</button>
    </nav>

    <!-- לשונית לידים -->
    <div id="tab-leads">
      <div class="toolbar">
        <input id="searchInput" type="search" placeholder="חיפוש לפי שם או טלפון...">
        <button class="btn-icon" id="refreshBtn" title="רענון" aria-label="רענון">⟳</button>
      </div>
      <div class="chips" id="statusChips"></div>
      <div id="leadsList"></div>
    </div>

    <!-- לשונית פולואפ -->
    <div id="tab-follow" hidden>
      <div id="followList"></div>
    </div>

    <!-- לשונית סיכום -->
    <div id="tab-summary" hidden>
      <div class="tiles" id="tiles"></div>
      <div class="card"><div class="section-title" style="margin-top:2px">לפי סטטוס</div><div id="byStatus"></div></div>
      <div class="card"><div class="section-title" style="margin-top:2px">לפי מודעה</div><div id="byAd"></div></div>
    </div>
  </section>

  <div id="loadingView" class="loading" hidden><span class="spin"></span>טוענת לידים...</div>
  <div id="setupView" class="empty" hidden>הדף עוד לא חובר לטבלה.<br>חסרה כתובת API_URL בקובץ - זה שלב ההתקנה של שיר, לא תקלה אצלך.</div>
</main>

<button class="fab" id="addBtn" hidden>+ ליד חדש</button>

<!-- חלון עריכה / הוספה -->
<div class="overlay" id="overlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true">
    <h2 id="sheetTitle"></h2>
    <div class="sub" id="sheetSub"></div>

    <div id="newLeadFields" hidden>
      <div class="field"><label for="fName">שם מלא</label><input id="fName" type="text"></div>
      <div class="field"><label for="fPhone">טלפון</label><input id="fPhone" type="tel" inputmode="tel" placeholder="050-0000000"></div>
    </div>

    <div class="field-row">
      <div class="field"><label for="fStatus">סטטוס</label><select id="fStatus"></select></div>
      <div class="field"><label for="fReason">סיבת אי-סגירה</label><select id="fReason"></select></div>
    </div>
    <div class="field-row">
      <div class="field"><label for="fEvent">תאריך האירוע</label><input id="fEvent" type="date"></div>
      <div class="field"><label for="fFollow">תאריך פולואפ</label><input id="fFollow" type="date"></div>
    </div>
    <div class="field"><label for="fNotes">דיווח והערות</label><textarea id="fNotes" rows="3"></textarea></div>
    <label class="check"><input id="fClosed" type="checkbox"><span>נסגרה עסקה 🎉</span></label>
    <div class="field"><label for="fValue">שווי הזמנה ₪</label><input id="fValue" type="number" inputmode="decimal" min="0" step="1"></div>

    <div class="sheet-btns">
      <button class="btn btn-save" id="saveBtn">שמירה</button>
      <button class="btn btn-cancel" id="cancelBtn">ביטול</button>
    </div>
  </div>
</div>

<script>
'use strict';
/* כתובת ה-Web app של Apps Script - מודבקת אחרי הפריסה בגוגל */
const API_URL = 'https://script.google.com/macros/s/AKfycbw23hVet72TBIaXW-kwBbUiIQ1D_e5mBSRbFpaGQv8evaVkalt5IBjBoAi6Z-4VT3ON/exec';

const CLOSED_STATUS = 'הזמנה נסגרה';
const OUT_STATUS = 'לא רלוונטי';
const state = { pin:'', leads:[], statuses:[], reasons:[], tab:'leads', filter:'', search:'', editing:null, adding:false };
const $ = id => document.getElementById(id);

/* ---------- API ---------- */
async function api(action, payload={}){
  const res = await fetch(API_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(Object.assign({pin:state.pin, action}, payload))
  });
  if(!res.ok) throw new Error('http_'+res.status);
  return res.json();
}

/* ---------- dates & phones ---------- */
function parseDate(s){                        // "14-09-2026" / "14/09/2026" / "14-09-2026 19:13"
  const m = /^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})/.exec(String(s||'').trim());
  return m ? new Date(+m[3], +m[2]-1, +m[1]) : null;
}
function toInputDate(s){
  const d = parseDate(s);
  return d ? d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0') : '';
}
function fmtDate(s){
  const d = parseDate(s);
  return d ? String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+d.getFullYear() : (s||'');
}
function today0(){ const d=new Date(); d.setHours(0,0,0,0); return d; }
function phoneDigits(p){ let d=String(p||'').replace(/\D/g,''); if(d.startsWith('972')) d='0'+d.slice(3); return d; }
function fmtPhone(p){ const d=phoneDigits(p); return d.length===10 ? d.slice(0,3)+'-'+d.slice(3) : (d||''); }
function waLink(p){ let d=String(p||'').replace(/\D/g,''); if(d.startsWith('0')) d='972'+d.slice(1); return 'https://wa.me/'+d; }
function money(n){ return '₪' + Number(n||0).toLocaleString('he-IL'); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------- lead helpers ---------- */
function isClosed(l){ return l.closed || l.status===CLOSED_STATUS; }
function isOut(l){ return l.status===OUT_STATUS; }
function leadValue(l){ const n=Number(String(l.value||'').replace(/[^\d.\-]/g,'')); return isNaN(n)?0:n; }
function pillClass(status){
  if(!status || status==='חדש') return 'p-new';
  if(status.startsWith('אין מענה')) return 'p-wait';
  if(status.startsWith('מעוניינת')) return 'p-interest';
  if(status==='נשלחה הצעה') return 'p-offer';
  if(status===CLOSED_STATUS) return 'p-closed';
  if(status===OUT_STATUS) return 'p-out';
  return 'p-interest';
}
function needsFollow(l){
  if(isClosed(l)||isOut(l)) return false;
  const d = parseDate(l.followup);
  return !!d && d <= today0();
}

/* ---------- toast ---------- */
let toastTimer=null;
function toast(msg, kind){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const t=document.createElement('div');
  t.className='toast'+(kind?' '+kind:''); t.textContent=msg;
  document.body.appendChild(t);
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.remove(), 2600);
}

/* ---------- rendering ---------- */
function leadCard(l){
  const followFlag = needsFollow(l);
  const rows=[];
  if(l.eventDate) rows.push('<span><span class="lbl">אירוע:</span><b class="num">'+esc(fmtDate(l.eventDate))+'</b></span>');
  if(l.followup) rows.push('<span'+(followFlag?' class="overdue"':'')+'><span class="lbl">פולואפ:</span><b class="num">'+esc(fmtDate(l.followup))+'</b>'+(followFlag?' ⏰':'')+'</span>');
  if(leadValue(l)>0) rows.push('<span><span class="lbl">שווי:</span><b class="num">'+esc(money(leadValue(l)))+'</b></span>');
  if(l.reason && !isClosed(l)) rows.push('<span><span class="lbl">סיבה:</span>'+esc(l.reason)+'</span>');
  const digits = phoneDigits(l.phone);
  return '<div class="card lead" data-row="'+l.row+'">'+
    '<div class="lead-top"><div><div class="lead-name">'+esc(l.name||'(ללא שם)')+'</div>'+
    '<div class="lead-meta num"><span>'+esc(fmtPhone(l.phone))+'</span>'+(l.created?' · <span>הגיע '+esc(fmtDate(l.created))+'</span>':'')+(l.ad?' · <span><bdi>'+esc(l.ad)+'</bdi></span>':'')+'</div></div>'+
    '<span class="pill '+pillClass(l.status)+'">'+esc(l.status||'חדש')+'</span></div>'+
    (rows.length?'<div class="lead-rows">'+rows.join('')+'</div>':'')+
    (l.notes?'<div class="lead-note">'+esc(l.notes)+'</div>':'')+
    '<div class="lead-actions">'+
      (digits?'<a class="act" href="tel:'+digits+'" onclick="event.stopPropagation()">📞 חיוג</a>':'')+
      (digits?'<a class="act" href="'+waLink(l.phone)+'" target="_blank" rel="noopener" onclick="event.stopPropagation()">💬 וואטסאפ</a>':'')+
      '<button class="act primary" data-edit="'+l.row+'">עדכון ליד</button>'+
    '</div></div>';
}

function renderChips(){
  const counts={};
  state.leads.forEach(l=>{ const s=l.status||'חדש'; counts[s]=(counts[s]||0)+1; });
  let html='<button class="chip'+(state.filter===''?' active':'')+'" data-f="">הכל ('+state.leads.length+')</button>';
  state.statuses.forEach(s=>{
    html+='<button class="chip'+(state.filter===s?' active':'')+'" data-f="'+esc(s)+'">'+esc(s)+(counts[s]?' ('+counts[s]+')':'')+'</button>';
  });
  $('statusChips').innerHTML=html;
}

function renderLeads(){
  const q=state.search.trim();
  let list=state.leads.slice().sort((a,b)=>b.row-a.row);
  if(state.filter) list=list.filter(l=>(l.status||'חדש')===state.filter);
  if(q) list=list.filter(l=>(l.name||'').includes(q) || phoneDigits(l.phone).includes(q.replace(/\D/g,'')||'␀'));
  $('leadsList').innerHTML = list.length ? list.map(leadCard).join('') :
    '<div class="empty">'+(state.leads.length?'לא נמצאו לידים מתאימים לסינון.':'אין עדיין לידים - ברגע שייכנס ליד מהקמפיין הוא יופיע כאן.')+'</div>';
}

function renderFollow(){
  const due=state.leads.filter(needsFollow).sort((a,b)=>{
    return (parseDate(a.followup)||0) - (parseDate(b.followup)||0);
  });
  const overdue=due.filter(l=>parseDate(l.followup) < today0());
  const todayList=due.filter(l=>+parseDate(l.followup) === +today0());
  let html='';
  if(overdue.length) html+='<div class="section-title">באיחור <span class="count">'+overdue.length+'</span></div>'+overdue.map(leadCard).join('');
  if(todayList.length) html+='<div class="section-title">להיום <span class="count">'+todayList.length+'</span></div>'+todayList.map(leadCard).join('');
  if(!due.length) html='<div class="empty">אין פולואפים להיום ✨<br>כל ליד שנקבע לו תאריך פולואפ יופיע כאן ביום שלו.</div>';
  $('followList').innerHTML=html;
  const b=$('followBadge');
  b.hidden = !due.length;
  b.textContent = due.length;
}

function renderSummary(){
  const total=state.leads.length;
  const closed=state.leads.filter(isClosed);
  const sum=closed.reduce((a,l)=>a+leadValue(l),0);
  const pct= total ? Math.round(closed.length/total*100) : 0;
  $('tiles').innerHTML=
    '<div class="tile"><div class="big num">'+total+'</div><div class="cap">לידים סה"כ</div></div>'+
    '<div class="tile"><div class="big num">'+closed.length+'</div><div class="cap">עסקאות שנסגרו</div></div>'+
    '<div class="tile"><div class="big num">'+pct+'%</div><div class="cap">אחוז סגירה</div></div>'+
    '<div class="tile gold"><div class="big num">'+money(sum)+'</div><div class="cap">שווי הזמנות כולל</div></div>';

  const byS={};
  state.leads.forEach(l=>{ const s=l.status||'חדש'; byS[s]=(byS[s]||0)+1; });
  const orderedS=[...state.statuses.filter(s=>byS[s]), ...Object.keys(byS).filter(s=>!state.statuses.includes(s))];
  $('byStatus').innerHTML = orderedS.length ? orderedS.map(s=>barRow(s, byS[s], total)).join('') :
    '<div class="empty" style="box-shadow:none;padding:14px">אין עדיין נתונים</div>';

  const byA={};
  state.leads.forEach(l=>{ const a=l.ad||l.campaign||'ללא שיוך'; byA[a]=(byA[a]||0)+1; });
  const ads=Object.entries(byA).sort((x,y)=>y[1]-x[1]);
  $('byAd').innerHTML = ads.length ? ads.map(([a,c])=>barRow(a,c,total)).join('') :
    '<div class="empty" style="box-shadow:none;padding:14px">אין עדיין נתונים</div>';
}
function barRow(label,count,total){
  const w= total ? Math.max(4, Math.round(count/total*100)) : 0;
  return '<div class="bar-row"><div class="bar-label">'+esc(label)+'</div>'+
    '<div class="bar-track"><div class="bar-fill" style="width:'+w+'%"></div></div>'+
    '<div class="bar-num num">'+count+'</div></div>';
}

function renderAll(){ renderChips(); renderLeads(); renderFollow(); renderSummary(); }

/* ---------- tabs ---------- */
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  state.tab=t.dataset.tab;
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===t));
  ['leads','follow','summary'].forEach(n=>$('tab-'+n).hidden = n!==state.tab);
}));

/* ---------- edit / add sheet ---------- */
function fillSelect(sel, items, current, emptyLabel){
  sel.innerHTML='<option value="">'+esc(emptyLabel)+'</option>'+
    items.map(s=>'<option value="'+esc(s)+'"'+(s===current?' selected':'')+'>'+esc(s)+'</option>').join('');
}
function openEdit(lead){
  state.editing=lead; state.adding=!lead;
  $('newLeadFields').hidden=!!lead;
  $('sheetTitle').textContent = lead ? lead.name||'(ללא שם)' : 'ליד חדש';
  $('sheetSub').textContent = lead ? fmtPhone(lead.phone)+(lead.created?' · הגיע '+fmtDate(lead.created):'') : 'הליד יתווסף גם לטבלה';
  fillSelect($('fStatus'), state.statuses, lead?lead.status:'חדש', '- ללא -');
  fillSelect($('fReason'), state.reasons, lead?lead.reason:'', '- ללא -');
  if(!lead){ $('fName').value=''; $('fPhone').value=''; if(state.statuses.includes('חדש')) $('fStatus').value='חדש'; }
  $('fEvent').value = lead?toInputDate(lead.eventDate):'';
  $('fFollow').value = lead?toInputDate(lead.followup):'';
  $('fNotes').value = lead?(lead.notes||''):'';
  $('fClosed').checked = lead?!!lead.closed:false;
  $('fValue').value = lead&&leadValue(lead)>0?leadValue(lead):'';
  $('overlay').hidden=false;
  document.body.style.overflow='hidden';
}
function closeEdit(){ $('overlay').hidden=true; state.editing=null; state.adding=false; document.body.style.overflow=''; }
$('cancelBtn').addEventListener('click', closeEdit);
$('overlay').addEventListener('click', e=>{ if(e.target===$('overlay')) closeEdit(); });

/* סטטוס "הזמנה נסגרה" מסמן אוטומטית נסגרה עסקה - כמו הסקריפט בשיטס */
$('fStatus').addEventListener('change', ()=>{ if($('fStatus').value===CLOSED_STATUS) $('fClosed').checked=true; });

$('saveBtn').addEventListener('click', async ()=>{
  const btn=$('saveBtn'); btn.disabled=true; btn.textContent='שומרת...';
  const fields={
    eventDate:$('fEvent').value, status:$('fStatus').value, reason:$('fReason').value,
    notes:$('fNotes').value, followup:$('fFollow').value,
    closed:$('fClosed').checked, value:$('fValue').value
  };
  try{
    let res;
    if(state.adding){
      const name=$('fName').value.trim(), phone=$('fPhone').value.trim();
      if(!name && !phone){ toast('צריך לפחות שם או טלפון','bad'); return; }
      res=await api('add',{fields:Object.assign({name,phone},fields)});
    }else{
      const l=state.editing;
      res=await api('update',{row:l.row, expect:{name:l.name, phone:l.phone}, fields});
    }
    if(res.ok){
      closeEdit(); toast('נשמר בטבלה ✓','ok'); await loadLeads(false);
    }else if(res.error==='row_mismatch'){
      closeEdit(); toast('הטבלה השתנתה בינתיים - הרשימה רועננה, נסי שוב','bad'); await loadLeads(false);
    }else if(res.error==='bad_pin'){
      logout();
    }else{
      toast('השמירה נכשלה - נסי שוב','bad');
    }
  }catch(err){
    toast('אין חיבור - בדקי אינטרנט ונסי שוב','bad');
  }finally{
    btn.disabled=false; btn.textContent='שמירה';
  }
});

/* ---------- events ---------- */
$('addBtn').addEventListener('click', ()=>openEdit(null));
$('refreshBtn').addEventListener('click', ()=>loadLeads(false));
$('searchInput').addEventListener('input', e=>{ state.search=e.target.value; renderLeads(); });
$('statusChips').addEventListener('click', e=>{
  const c=e.target.closest('.chip'); if(!c) return;
  state.filter=c.dataset.f; renderChips(); renderLeads();
});
document.addEventListener('click', e=>{
  const btn=e.target.closest('[data-edit]');
  const card=e.target.closest('.lead');
  const row = btn ? +btn.dataset.edit : (card ? +card.dataset.row : null);
  if(row==null) return;
  const lead=state.leads.find(l=>l.row===row);
  if(lead) openEdit(lead);
});

/* ---------- deep link ---------- */
/* קישור מההתראה בוואטסאפ: #lead=<מספר שורה בשיטס>. מספר שורה ולא טלפון - כדי שפרטי הליד לא יופיעו בקישור.
   נפתח פעם אחת לכל קישור, אחרת הרענון האוטומטי היה פותח את החלון מחדש כל 2 דקות. */
let hashHandled=false;
function openLeadFromHash(){
  const m=/^#lead=(\d+)$/.exec(location.hash);
  if(!m || hashHandled) return;
  hashHandled=true;
  const lead=state.leads.find(l=>l.row===+m[1]);
  if(lead) openEdit(lead);
  else toast('הליד מהקישור לא נמצא - חפשי אותו ברשימה','bad');
}
window.addEventListener('hashchange', ()=>{
  hashHandled=false;
  if(state.pin && !$('appView').hidden && $('overlay').hidden) openLeadFromHash();
});

/* ---------- load & login ---------- */
async function loadLeads(showSpinner){
  if(showSpinner) $('loadingView').hidden=false;
  try{
    const res=await api('list');
    if(res.ok){
      state.leads=res.leads||[]; state.statuses=res.statuses||[]; state.reasons=res.reasons||[];
      renderAll();
      $('appView').hidden=false; $('addBtn').hidden=false; $('loginView').hidden=true;
      openLeadFromHash();
      return true;
    }
    if(res.error==='bad_pin'){ logout(); return false; }
    toast('הטעינה נכשלה - נסי לרענן','bad'); return false;
  }catch(err){
    toast('אין חיבור לטבלה - בדקי אינטרנט','bad'); return false;
  }finally{
    $('loadingView').hidden=true;
  }
}

function logout(){
  try{ localStorage.removeItem('otb_pin'); }catch(e){}
  state.pin='';
  $('appView').hidden=true; $('addBtn').hidden=true; $('loginView').hidden=false;
  $('loginErr').textContent='הקוד לא נכון או התחלף - נסי שוב';
}

async function tryLogin(pin){
  state.pin=pin;
  $('loginBtn').disabled=true; $('loginBtn').textContent='בודקת...'; $('loginErr').textContent='';
  const ok=await loadLeads(false);
  $('loginBtn').disabled=false; $('loginBtn').textContent='כניסה';
  if(ok){ try{ localStorage.setItem('otb_pin', pin); }catch(e){} }
  else if(!$('loginErr').textContent){ $('loginErr').textContent='הקוד לא נכון'; }
}
$('loginBtn').addEventListener('click', ()=>{ const p=$('pinInput').value.trim(); if(p) tryLogin(p); });
$('pinInput').addEventListener('keydown', e=>{ if(e.key==='Enter'){ const p=$('pinInput').value.trim(); if(p) tryLogin(p); } });

/* רענון אוטומטי כל 2 דקות כשהדף פתוח */
setInterval(()=>{ if(!document.hidden && state.pin && $('overlay').hidden) loadLeads(false); }, 120000);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && state.pin && $('overlay').hidden) loadLeads(false); });

/* ---------- init ---------- */
(function init(){
  if(!API_URL || API_URL.indexOf('PASTE_') === 0){ $('setupView').hidden=false; return; }
  let saved=''; try{ saved=localStorage.getItem('otb_pin')||''; }catch(e){}
  if(saved){ state.pin=saved; $('loadingView').hidden=false; loadLeads(true).then(ok=>{ if(!ok) $('loginView').hidden=false; }); }
  else $('loginView').hidden=false;
})();
</script>
</body>
</html>
